name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'project.zip'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Unpack project.zip
        run: |
          test -f project.zip || { echo "project.zip is missing in the repo root"; exit 1; }
          mkdir -p work
          unzip -q project.zip -d work
          ls work
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK
        working-directory: work/voicefx
        run: |
          chmod +x ci/build_apk.sh
          ./ci/build_apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceFXStudio-apk
          path: work/voicefx/build/VoiceFXStudio.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" work/voicefx/build/VoiceFXStudio.apk \
            --title "Voice FX Studio build ${{ github.run_number }}" \
            --notes "Debug APK (Gradle build, native VfxRecorder)."
            
